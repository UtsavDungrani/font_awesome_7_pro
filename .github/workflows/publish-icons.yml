name: Publish icon batches

# Runs on GitHub's servers, so it does not matter whether the laptop is on.
#
# To look completely natural and human:
# 1. Runs late evening (16:30 UTC = 22:00 IST) and backdates commits across
#    today's normal waking hours (e.g. 10 AM, 2 PM, 5 PM, 8 PM).
# 2. Makes a randomized number of commits per day (between 3 and 10).
# 3. Incorporates occasional rest days (~15% weekday, ~25% weekend).

on:
  schedule:
    # 16:30 UTC = 22:00 IST. GitHub may delay scheduled runs under load.
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      min_commits:
        description: "Minimum commits this run"
        required: false
        default: "3"
      max_commits:
        description: "Maximum commits this run"
        required: false
        default: "10"
      icons:
        description: "Icons per commit"
        required: false
        default: "9"
      allow_skip:
        description: "Allow rest day skip on manual run (true/false)"
        required: false
        default: "false"

# Never let two runs push over each other.
concurrency:
  group: publish-icons
  cancel-in-progress: false

env:
  DEFAULT_MIN_COMMITS: "3"
  DEFAULT_MAX_COMMITS: "10"
  ICONS_PER_COMMIT: "9"
  # Contributions are attributed by email, so this has to be an address
  # verified on the account that should get the green squares.
  COMMIT_NAME: "Utsav Dungrani"
  COMMIT_EMAIL: "utsavdungrani7@gmail.com"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure the committer
        run: |
          git config user.name  "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"

      - name: Publish the batches
        env:
          MIN_COMMITS: ${{ github.event.inputs.min_commits || vars.MIN_COMMITS || env.DEFAULT_MIN_COMMITS }}
          MAX_COMMITS: ${{ github.event.inputs.max_commits || vars.MAX_COMMITS || env.DEFAULT_MAX_COMMITS }}
          ICONS: ${{ github.event.inputs.icons || vars.ICONS_PER_COMMIT || env.ICONS_PER_COMMIT }}
          ALLOW_SKIP: ${{ github.event.inputs.allow_skip || 'false' }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail

          EXTRA_FLAGS=()
          if [ "$IS_SCHEDULED" = "true" ] || [ "$ALLOW_SKIP" = "true" ]; then
            EXTRA_FLAGS+=(--rest-day-chance 0.15 --weekend-rest-chance 0.25)
          else
            EXTRA_FLAGS+=(--force)
          fi

          python scripts/add_icons.py "$ICONS" \
            --min-batches "$MIN_COMMITS" \
            --max-batches "$MAX_COMMITS" \
            --spread-timestamps \
            --commit --no-push \
            "${EXTRA_FLAGS[@]}"

      - name: Push
        if: env.made != '0'
        run: |
          set -euo pipefail
          # Retry once in case something else pushed while this run was going.
          git push || {
            git pull --rebase
            git push
          }

